name: Auto approve low risk and hot fix PRs

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      # Create GitHub App token
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANAM_PUSH_BOT_APP_ID }}
          private-key: ${{ secrets.ANAM_PUSH_BOT_PRIVATE_KEY }}

      # Auto-approve script
      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'hot-fix') || contains(github.event.pull_request.labels.*.name, 'low-risk'))
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // Get existing reviews for the PR
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Check if there's already an approval
            const hasApproval = reviews.some(review => review.state === 'APPROVED');

            if (hasApproval) {
              console.log('PR is already approved, skipping auto-approval');
              return;
            }

            // Get the labels that triggered auto-approval
            const labels = context.payload.pull_request.labels || [];
            const triggerLabels = labels
              .filter(label => ['hot-fix', 'low-risk'].includes(label.name))
              .map(label => label.name);

            const labelText = triggerLabels.length > 0
              ? `with label(s): ${triggerLabels.join(', ')}`
              : 'by org policy';

            // Create approval review since none exists
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: `✅ Auto‑approved ${labelText}`
            });

            console.log(`PR auto-approved successfully ${labelText}`);

